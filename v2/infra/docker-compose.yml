name: vizibble

x-server-env: &server-env
  NODE_ENV: production
  PORT: "3000"
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  FRONTEND_URL: ${PUBLIC_URL}
  BETTER_AUTH_URL: ${PUBLIC_URL}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_SECURE: ${SMTP_SECURE}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  SMTP_FROM: ${SMTP_FROM}
  # AI integrations (Vera): off until Vera is deployed
  AI_INTEGRATIONS_ENABLED: ${AI_INTEGRATIONS_ENABLED:-false}
  VERA_MCP_URL: ${VERA_MCP_URL:-}
  VERA_SERVICE_TOKEN: ${VERA_SERVICE_TOKEN:-}
  VERA_WHATSAPP_NUMBER: ${VERA_WHATSAPP_NUMBER:-}

x-server-build: &server-build
  context: ..
  dockerfile: infra/docker/server.Dockerfile

services:
  # Reverse proxy + static client, the only service exposed publicly
  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        BUN_PUBLIC_API_URL: ${PUBLIC_URL}
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: *server-build
    image: vizibble-server
    environment: *server-env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v2/auth/ok"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: vizibble-server
    command: ["bun", "src/worker.ts"]
    environment: *server-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Runs pending Drizzle migrations, then exits
  migrate:
    image: vizibble-server
    command: ["bunx", "drizzle-kit", "migrate"]
    environment: *server-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # AOF persistence and noeviction so queued emails are never dropped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
