name: Send Cosmo Daily Performance Email

on:
  schedule:
    # 8:45 AM IST is 3:15 AM UTC
    - cron: '15 3 * * *'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: |
          cd backend
          bun install

      - name: Run Cosmo Daily Report Script
        run: |
          cd backend
          bun run scripts/sendCosmoDailyReport.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          COSMO_DEVICE_ID: ${{ secrets.COSMO_DEVICE_ID }}
          NODE_ENV: production
